apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endpointguard.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "endpointguard.name" . }}-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "endpointguard.name" . }}-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "endpointguard.name" . }}-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.api.env.PORT }}"
            - name: SERVICE_NAME
              value: "{{ .Values.api.env.SERVICE_NAME }}"
            - name: LOG_LEVEL
              value: "{{ .Values.api.env.LOG_LEVEL }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.api.env.OTEL_EXPORTER_OTLP_ENDPOINT }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.databaseUrlSecret }}
                  key: {{ .Values.api.secrets.databaseUrlKey }}
            - name: VAULT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.vaultMasterKeySecret }}
                  key: {{ .Values.api.secrets.vaultMasterKeyKey }}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.jwtSecretKeySecret }}
                  key: {{ .Values.api.secrets.jwtSecretKeyKey }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
