apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endpointguard.fullname" . }}-drift-worker
  labels:
    app.kubernetes.io/name: {{ include "endpointguard.name" . }}-drift-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workers.driftWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "endpointguard.name" . }}-drift-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "endpointguard.name" . }}-drift-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: drift-worker
          image: "{{ .Values.workers.driftWorker.image.repository }}:{{ .Values.workers.driftWorker.image.tag }}"
          command: ["/app/server", "--worker-mode=drift"]
          env:
            - name: SERVICE_NAME
              value: "endpointguard-drift-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.api.env.OTEL_EXPORTER_OTLP_ENDPOINT }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.databaseUrlSecret }}
                  key: {{ .Values.api.secrets.databaseUrlKey }}
          resources:
            {{- toYaml .Values.workers.driftWorker.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
