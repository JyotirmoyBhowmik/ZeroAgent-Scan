version: '3.8'

# =============================================================================
# ZeroAgent-Scan / EndpointGuard EMS — Local Development Environment
# 100% Isolated from production network. Uses RFC 5737 documentation subnets
# and simulated 6-stage agentless WinRM scan engine (MOCK_SCAN_MODE=true).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 15+ (Dev DB with pre-loaded migrations & RFC 5737 mock fleet)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: zeroagent-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpointguard
      POSTGRES_USER: endpointguard_app
      POSTGRES_PASSWORD: endpointguard_secure_dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./packages/db/init-all.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./packages/db/seed-dev.sql:/docker-entrypoint-initdb.d/02_seed_dev_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endpointguard_app -d endpointguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeroagent-dev-net

  # ---------------------------------------------------------------------------
  # 2. Control Plane API (Go backend with MOCK_SCAN_MODE=true)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zeroagent-dev-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "development"
      MOCK_SCAN_MODE: "true"
      DATABASE_URL: "postgres://endpointguard_app:endpointguard_secure_dev_password_change_in_prod@postgres:5432/endpointguard?sslmode=disable"
      VAULT_MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      LOG_LEVEL: "debug"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zeroagent-dev-net

  # ---------------------------------------------------------------------------
  # 3. Web Dashboard (Next.js 14 App Router, White & Charcoal Enterprise Theme)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: zeroagent-dev-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api
    networks:
      - zeroagent-dev-net

  # ---------------------------------------------------------------------------
  # 4. Collector Gateway Daemon (Mock Subnet Gateway for 192.0.2.0/24)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: zeroagent-dev-gateway
    restart: unless-stopped
    environment:
      GATEWAY_ID: "gw-subnet-192-0-2-0"
      SUBNET_CIDR: "192.0.2.0/24"
      CONTROL_PLANE_URL: "http://api:8080"
      HEARTBEAT_INTERVAL_SEC: "10"
      LOG_LEVEL: "info"
    depends_on:
      - api
    networks:
      - zeroagent-dev-net

volumes:
  postgres_dev_data:
    driver: local

networks:
  zeroagent-dev-net:
    driver: bridge
