version: "2"
sql:
  - schema: "schema.sql"
    queries: "queries.sql"
    gen:
      go:
        package: "db"
        out: "../../apps/api/internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: true
